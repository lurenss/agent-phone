# Built-in policy. Shipped as package data, loaded by cli/driver.py, parsed by
# core/policy/rules.py. It names no app: only words, framework ids, keys and URI schemes.
# Words are phrases; a phrase matches a run of consecutive words in one label. A leading ^
# anchors it to the label's first word: "Post" commits, "More actions for this post" does not.

languages = ["en", "it"]

[[commit]]
id = "default.publish"
effect = "publish"
words = ["share", "^post", "publish", "upload", "go live", "repost",
         "condividi", "pubblica", "carica"]
reason = "Makes content visible to others."

[[commit]]
id = "default.schedule"
effect = "schedule"
words = ["schedule", "programma", "pianifica"]
reason = "Queues a post or message for later."

[[commit]]
id = "default.send"
effect = "send"
words = ["send", "reply", "comment", "call", "invia", "rispondi", "commenta", "chiama", "chiamata",
         "videochiamata"]
reason = "Delivers a message or a call to someone."

[[commit]]
id = "default.delete"
effect = "delete"
words = ["delete", "remove", "discard", "erase", "clear all", "clear data", "clear storage",
         "uninstall", "elimina", "rimuovi", "scarta", "cancella", "disinstalla"]
reason = "Destroys data."

[[commit]]
id = "default.purchase"
effect = "purchase"
words = ["buy", "pay", "purchase", "subscribe", "donate", "boost", "promote", "place order",
         "acquista", "paga", "abbonati", "sponsorizza"]
reason = "Spends money."

[[commit]]
id = "default.social"
effect = "social"
words = ["follow", "unfollow", "block", "report", "join", "segui", "blocca", "segnala", "iscriviti",
         "partecipa", "unisciti"]
reason = "Changes who the account is connected to, or what it joins, visibly."

[[commit]]
id = "default.system"
effect = "system"
words = ["airplane mode", "mobile data", "vpn", "force stop", "disable", "factory", "reset",
         "power off", "restart", "usb debugging", "developer options",
         "modalità aereo", "dati mobili", "arresto forzato", "disattiva", "ripristina", "spegni", "riavvia"]
reason = "Changes device state that can cut off the device or the agent."

[[commit]]
id = "default.consent"
effect = "consent"
words = ["authorize", "authorise", "accept", "agree", "allow", "consent", "grant access",
         "autorizza", "accetta", "accetto", "consenti", "concedi", "consenso"]
reason = "Gives a permission, a consent or an authorization that the user owns."

[[commit]]
id = "default.confirm"
effect = "confirm"
words = ["confirm", "submit", "conferma"]
reason = "Confirms an action whose effect the label does not say."

[[commit]]
id = "default.key.enter"
effect = "send"
keys = ["enter"]
reason = "Enter submits many fields."

[[commit]]
id = "default.uri.contact"
effect = "send"
uri_schemes = ["tel", "sms", "smsto", "mms", "mailto"]
reason = "Opens a call or a prefilled message."

[[exempt]]
id = "default.consent-declined"
labels = ["don't allow", "don’t allow", "do not allow",
          "don't accept", "don’t accept", "do not accept",
          "don't agree", "don’t agree", "do not agree",
          "i don't agree", "i don’t agree", "i do not agree",
          "don't authorize", "don’t authorize", "do not authorize",
          "don't authorise", "don’t authorise", "do not authorise",
          "don't consent", "don’t consent", "do not consent",
          "don't grant access", "don’t grant access", "do not grant access",
          "non accetto"]
reason = "A decline that holds a consent word. It gives nothing, and the way out of a consent screen must stay open."

[[ignore]]
id = "default.preference-summary"
node_ids = ["android:id/summary"]
reason = "A preference summary lists what its screen contains (\"Block, Allow, Do not disturb\")."

[[inherit]]
id = "default.affirmative"
words = ["ok", "okay", "yes", "done", "continue", "accept", "agree", "allow", "apply", "got it",
         "turn off", "turn on", "disable", "enable", "stop", "disconnect", "remove",
         "sì", "fatto", "continua", "accetta", "consenti", "applica",
         "disattiva", "attiva", "interrompi", "disconnetti", "rimuovi"]
node_ids = ["android:id/button1"]
reason = "A neutral button, or a verb that takes its object from the question, does what its dialog says. android:id/button1 is the positive button of a platform dialog, whatever it is called."

# Interruptions: pop-ups the agent did not ask for. A rule matches a window in which every
# phrase of `words` shows. `dismiss` is the whole name of the button that is the safe way out.
# agent-phone names both in every observation and never clicks. The words are those of
# Android's own dialogs, one rule per language, because all of a rule's words must show.

[[interruption]]
id = "default.not-responding.en"
kind = "not_responding"
languages = ["en"]
words = ["isn't responding", "close app", "wait"]
dismiss = ["Wait"]
reason = "The system says an app does not respond. Wait keeps the app and its state."

[[interruption]]
id = "default.not-responding.it"
kind = "not_responding"
languages = ["it"]
words = ["non risponde", "chiudi app", "attendi"]
dismiss = ["Attendi"]
reason = "The system says an app does not respond. Attendi keeps the app and its state."

[[interruption]]
id = "default.permission.en"
kind = "permission"
languages = ["en"]
words = ["^allow", "don't allow"]
dismiss = ["Don't allow"]
reason = "A prompt asks for a permission. The decline gives nothing."

[[interruption]]
id = "default.permission.deny.en"
kind = "permission"
languages = ["en"]
words = ["^allow", "^deny"]
dismiss = ["Deny"]
reason = "A prompt asks for a permission, with the buttons older Android versions show. The decline gives nothing."

[[interruption]]
id = "default.permission.it"
kind = "permission"
languages = ["it"]
words = ["^consentire", "non consentire"]
dismiss = ["Non consentire"]
reason = "A prompt asks for a permission. The decline gives nothing."

[[interruption]]
id = "default.permission.deny.it"
kind = "permission"
languages = ["it"]
words = ["^consenti", "^rifiuta"]
dismiss = ["Rifiuta"]
reason = "A prompt asks for a permission, with the buttons older Android versions show. The decline gives nothing."

[[interruption]]
id = "default.paste.en"
kind = "paste"
languages = ["en"]
words = ["paste", "^allow"]
dismiss = ["Don't allow paste", "Don't allow", "Deny"]
needs_human = true
reason = "A prompt asks to read the clipboard, which can hold a password. Only the user decides."

[[interruption]]
id = "default.paste.it"
kind = "paste"
languages = ["it"]
words = ["incollare", "^consenti"]
dismiss = ["Non consentire Incolla", "Non consentire", "Rifiuta"]
needs_human = true
reason = "A prompt asks to read the clipboard, which can hold a password. Only the user decides."

[[interruption]]
id = "default.purchase.en"
kind = "purchase"
languages = ["en"]
words = ["1-tap buy"]
needs_human = true
reason = "A purchase sheet is one tap from spending money. Only the user buys."

[[interruption]]
id = "default.purchase.it"
kind = "purchase"
languages = ["it"]
words = ["acquista con 1 tocco"]
needs_human = true
reason = "A purchase sheet is one tap from spending money. Only the user buys."
