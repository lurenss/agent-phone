<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 340" width="1080" height="340" xml:lang="en" role="img" aria-labelledby="title desc">
  <title id="title">Agent Phone architecture</title>
  <desc id="desc">A coding agent runs the Bun CLI on the Mac. The CLI starts the bundled Python driver with uv. The driver uses the local ADB server to reach a USB phone or Android emulator by serial number. UIAutomator2 reads screen elements on Android. The CLI returns the result as JSON.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#424c57"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #465160; }
      .label { font-size: 19px; font-weight: 650; }
      .detail { font-size: 15px; fill: #384452; }
      .edge { fill: none; stroke: #424c57; stroke-width: 1.8; marker-end: url(#arrow); }
      .code { fill: #dcebfb; stroke: #7fa7d9; }
      .device { fill: #ddf2e3; stroke: #7dbf93; }
      rect { stroke-width: 1.4; }
    </style>
  </defs>
  <rect width="1080" height="340" fill="white"/>
  <text x="28" y="48" class="title">Agent Phone</text>
  <text x="28" y="82" class="subtitle">The agent runs a command on the Mac and reads the JSON response.</text>

  <g text-anchor="middle">
    <rect x="28" y="159" width="162" height="78" rx="10" fill="white" stroke="#9aa3ad"/>
    <text x="109" y="193" class="label">Coding agent</text>
    <text x="109" y="216" class="detail">Codex or Claude Code</text>
    <rect x="218" y="159" width="166" height="78" rx="10" class="code"/>
    <text x="301" y="193" class="label">./agent-phone</text>
    <text x="301" y="216" class="detail">Bun CLI · src/cli.ts</text>
    <rect x="412" y="159" width="166" height="78" rx="10" class="code"/>
    <text x="495" y="193" class="label">src/local.py</text>
    <text x="495" y="216" class="detail">Python driver · uv</text>
    <rect x="606" y="159" width="176" height="78" rx="10" class="code"/>
    <text x="694" y="193" class="label">Local ADB server</text>
    <text x="694" y="216" class="detail">127.0.0.1:5037</text>
    <rect x="834" y="110" width="218" height="72" rx="10" class="device"/>
    <text x="943" y="140" class="label">Android phone</text>
    <text x="943" y="162" class="detail">Connected via USB</text>
    <rect x="834" y="214" width="218" height="72" rx="10" class="device"/>
    <text x="943" y="244" class="label">Android emulator</text>
    <text x="943" y="266" class="detail">Running on the Mac</text>
  </g>
  <path class="edge" d="M190 198 H215"/>
  <path class="edge" d="M384 198 H409"/>
  <path class="edge" d="M578 198 H603"/>
  <path class="edge" d="M782 198 H808 V146 H831"/>
  <path class="edge" d="M808 198 V250 H831"/>
  <text x="28" y="310" class="detail">ADB selects the device by serial number. UIAutomator2 reads controls, taps elements, and enters text on Android.</text>
</svg>
