# The commit table. tests/test_commit_table.py plants each label in a tapped element's text, its
# content-desc, its hint, its resource-id, its class name and a child's text, and every
# placement must give the effects listed here. Every phrase of the default policy has a row, and
# the test fails when a phrase is added to the default policy without one.
#
# The [[affirmative]] rows follow. Each plants an affirmative label in a button that sits under a
# question, in the placements a user reads (text, content-desc, hint, a child's text). The effects
# are the union of the button's own words and the question's: an affirmative does what its dialog
# says and keeps what it says itself. Every affirmative of the default policy has a row, and the
# question of a row never commits the effect the label already carries, so the union shows.

